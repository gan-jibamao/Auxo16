name: Build Auxo16 Probe

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # rootless: installs under /var/jb
          - scheme: rootless
            arch: iphoneos-arm64
            prefix: var/jb
          # RootHide: installs at /, Architecture iphoneos-arm64e
          - scheme: roothide
            arch: iphoneos-arm64e
            prefix: ""

    name: build (${{ matrix.scheme }})

    steps:
      - uses: actions/checkout@v4

      - name: Install clang + lld
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg-dev
          # Pin clang/LLD 19: clang 21 emits arm64e ptrauth relocations that
          # ld64.lld rejects ("INVALID relocation has width 8 bytes, but must
          # be 0 bytes"). 19 is the version this build is verified against.
          if sudo apt-get install -y -qq clang-19 lld-19; then
            for pair in "clang clang-19" "clang++ clang++-19" \
                        "ld64.lld ld64.lld-19" "ld.lld ld.lld-19"; do
              set -- $pair
              sudo update-alternatives --install /usr/bin/$1 $1 /usr/bin/$2 100
            done
          else
            echo "clang-19 unavailable, falling back to default clang"
            sudo apt-get install -y -qq clang lld
          fi
          clang --version | head -1
          ld64.lld --version | head -1

      - name: Install SDK
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/theos/sdks.git /tmp/sdks
          cd /tmp/sdks
          git sparse-checkout set iPhoneOS16.5.sdk
          echo "SDK=/tmp/sdks/iPhoneOS16.5.sdk" >> "$GITHUB_ENV"
          ls /tmp/sdks/iPhoneOS16.5.sdk

      - name: Compile both slices
        run: |
          set -e
          O=.build
          rm -rf "$O"; mkdir -p "$O"

          for ARCH in arm64 arm64e; do
            echo "=== $ARCH ==="
            clang -target ${ARCH}-apple-ios16.0 \
                  -isysroot "$SDK" -fobjc-arc -O2 -Wall \
                  -c probe/Auxo16Probe.m \
                  -o "$O/Auxo16Probe.$ARCH.o"

            clang -target ${ARCH}-apple-ios16.0 \
                  -isysroot "$SDK" \
                  -fuse-ld=lld -dynamiclib -undefined dynamic_lookup \
                  -o "$O/Auxo16Probe.$ARCH.dylib" \
                  "$O/Auxo16Probe.$ARCH.o" \
                  -framework Foundation -framework UIKit
          done
          ls -l "$O"

      - name: Merge FAT dylib
        run: |
          set -e
          python3 tools/make_fat.py .build/Auxo16Probe.dylib \
            .build/Auxo16Probe.arm64.dylib \
            .build/Auxo16Probe.arm64e.dylib
          python3 tools/verify_arch.py .build/Auxo16Probe.dylib

      - name: Package
        run: |
          set -e
          ROOT=layout-pkg
          rm -rf "$ROOT"
          DEST="$ROOT/${{ matrix.prefix }}"
          mkdir -p "$DEST/Library/MobileSubstrate/DynamicLibraries"
          mkdir -p "$ROOT/DEBIAN"

          cp .build/Auxo16Probe.dylib \
             "$DEST/Library/MobileSubstrate/DynamicLibraries/"
          cp Auxo16Probe.plist \
             "$DEST/Library/MobileSubstrate/DynamicLibraries/"
          cp layout/DEBIAN/control "$ROOT/DEBIAN/control"

          sed -i "s|^Architecture:.*|Architecture: ${{ matrix.arch }}|" \
            "$ROOT/DEBIAN/control"
          chmod 755 "$DEST/Library/MobileSubstrate/DynamicLibraries/Auxo16Probe.dylib"

          echo "--- control ---"
          cat "$ROOT/DEBIAN/control"
          echo "--- tree ---"
          find "$ROOT" -type f | sort

          mkdir -p packages
          DEB="packages/com.ganjibamao.auxo16probe_1.0.0_${{ matrix.arch }}.deb"
          dpkg-deb --build --root-owner-group "$ROOT" "$DEB"
          ls -l packages/

      - name: Verify package
        run: |
          set -e
          DEB=$(ls packages/*.deb | head -1)
          echo "deb: $DEB"
          dpkg-deb -f "$DEB" Package Version Architecture
          TMP=$(mktemp -d)
          dpkg-deb -x "$DEB" "$TMP"
          DYLIB=$(find "$TMP" -name 'Auxo16Probe.dylib' | head -1)
          echo "dylib: $DYLIB"
          python3 tools/verify_arch.py "$DYLIB"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Auxo16Probe-${{ matrix.scheme }}
          path: packages/*.deb
          if-no-files-found: error
