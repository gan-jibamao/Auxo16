name: Build Auxo16 Probe

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          # rootless：Architecture iphoneos-arm64，装到 /var/jb
          - scheme: rootless
            deb_arch: iphoneos-arm64
            artifact: roothide-off
          # RootHide：Architecture iphoneos-arm64e，装到 / 根
          - scheme: roothide
            deb_arch: iphoneos-arm64e
            artifact: roothide-on

    name: build (${{ matrix.scheme }})

    steps:
      - uses: actions/checkout@v4

      - name: Install theos
        run: |
          brew install ldid xz
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Install SDK
        run: |
          mkdir -p "$THEOS/sdks"
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/sdks
          cd /tmp/sdks
          git sparse-checkout set iPhoneOS16.5.sdk
          cp -R iPhoneOS16.5.sdk "$THEOS/sdks/"
          ls "$THEOS/sdks"

      - name: Set package architecture
        run: |
          sed -i '' 's/^Architecture:.*/Architecture: ${{ matrix.deb_arch }}/' layout/DEBIAN/control
          grep '^Architecture' layout/DEBIAN/control

      - name: Build (${{ matrix.scheme }})
        run: |
          make clean all
          make package \
            THEOS_PACKAGE_SCHEME=${{ matrix.scheme }} \
            FINALPACKAGE=1 \
            DEBUG=0 \
            ARCHS="arm64 arm64e"
          echo "--- built ---"
          ls -l packages/

      - name: Verify architecture
        run: |
          DEB=$(ls packages/*.deb | head -1)
          echo "deb: $DEB"
          dpkg-deb -f "$DEB" Architecture Package Version
          TMP=$(mktemp -d)
          dpkg-deb -x "$DEB" "$TMP"
          DYLIB=$(find "$TMP" -name 'Auxo16Probe.dylib' | head -1)
          echo "dylib: $DYLIB"
          python3 - "$DYLIB" <<'PY'
import struct, sys
d = open(sys.argv[1], 'rb').read()
m = struct.unpack('<I', d[:4])[0]
if m in (0xcafebabe, 0xbebafeca):
    n = struct.unpack('>I', d[4:8])[0]
    print('FAT with %d slices' % n)
    ok = False
    for i in range(n):
        off = 8 + i * 20
        cpu, sub, o, sz, al = struct.unpack('>iiIII', d[off:off+20])
        print('  cpu=%#x sub=%#x size=%d' % (cpu, sub, sz))
        if cpu == 0x0100000c:
            ok = True
    assert ok, 'GATE FAIL: no arm64 slice'
else:
    cpu, sub, ft = struct.unpack('<iiI', d[4:16])
    print('thin cpu=%#x sub=%#x ft=%d' % (cpu, sub, ft))
    assert cpu == 0x0100000c, 'GATE FAIL: not arm64'
print('>>> ARCH GATE PASS')
PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Auxo16Probe-${{ matrix.artifact }}
          path: packages/*.deb
          if-no-files-found: error
