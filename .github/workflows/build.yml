name: Build Auxo16 Probe

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # rootless: installs under /var/jb
          - scheme: rootless
            artifact: rootless
          # RootHide: installs at /, Architecture iphoneos-arm64e
          - scheme: roothide
            artifact: roothide

    name: build (${{ matrix.scheme }})

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            make git curl xz-utils fakeroot libplist-utils \
            libssl-dev libplist-dev libc6-dev zlib1g
          # libxml2 / libtinfo5 package names differ across Ubuntu releases
          # (noble: libxml2 -> libxml2t64, no libtinfo5 at all). Install
          # whatever exists, never fail the step.
          for pkg in libxml2 libxml2t64 libtinfo5 libncurses5 libncurses6; do
            sudo apt-get install -y -qq "$pkg" || echo "skip $pkg"
          done
          # ldid (no apt package on ubuntu) -> prebuilt release
          curl -fsSL -o /usr/local/bin/ldid \
            https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64
          sudo chmod +x /usr/local/bin/ldid
          ldid -h 2>&1 | head -2 || true
          # Toolchain targets an older Ubuntu: patch up the .so names it wants.
          LIBDIR=/usr/lib/x86_64-linux-gnu
          [ -e "$LIBDIR/libtinfo.so.5" ] || \
            sudo ln -sf "$LIBDIR/libtinfo.so.6" "$LIBDIR/libtinfo.so.5" || true
          [ -e "$LIBDIR/libtinfo.so.5" ] || \
            sudo ln -sf "$(ls $LIBDIR/libtinfo.so.* 2>/dev/null | head -1)" \
                        "$LIBDIR/libtinfo.so.5" || true
          sudo ldconfig
          echo "--- libs ---"
          ls -l "$LIBDIR/libtinfo.so.5" "$LIBDIR/libxml2.so.2" 2>&1 || true

      - name: Install theos
        run: |
          git clone --recursive --depth 1 https://github.com/roothide/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          ls "$HOME/theos"

      - name: Install iOS toolchain
        run: |
          # Linux needs a prebuilt cross toolchain (no Xcode available).
          # The release asset is raw LZMA (.tar.lzma == tar + lzma stream),
          # not xz -- tar -xf cannot auto-detect it.
          sudo apt-get install -y -qq xz-utils lzma
          mkdir -p "$THEOS/toolchain"
          cd /tmp
          curl -fsSL --retry 3 --retry-delay 2 -o tc.tar.lzma \
            https://github.com/sbingner/llvm-project/releases/latest/download/linux-ios-arm64e-clang-toolchain.tar.lzma
          ls -l tc.tar.lzma
          xz --format=lzma -d -k tc.tar.lzma || unlzma -k tc.tar.lzma
          ls -l tc.tar
          mkdir -p "$THEOS/toolchain/linux"
          tar -xf tc.tar -C "$THEOS/toolchain/linux"
          ls "$THEOS/toolchain/linux"
          # tarball unpacks to ios-arm64e-clang-toolchain/{bin,include,lib,...}
          TC="$THEOS/toolchain/linux/ios-arm64e-clang-toolchain"
          ls "$TC"
          mkdir -p "$THEOS/toolchain/linux/iphone"
          ln -sfn "$TC/bin" "$THEOS/toolchain/linux/iphone/bin"
          ln -sfn "$TC/lib" "$THEOS/toolchain/linux/iphone/lib"
          ls -l "$THEOS/toolchain/linux/iphone/"
          ls -l "$THEOS/toolchain/linux/iphone/bin/" | head -5
          "$THEOS/toolchain/linux/iphone/bin/clang" --version | head -2

      - name: Install SDK
        run: |
          mkdir -p "$THEOS/sdks"
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/sdks
          cd /tmp/sdks
          git sparse-checkout set iPhoneOS16.5.sdk
          cp -R iPhoneOS16.5.sdk "$THEOS/sdks/"
          ls "$THEOS/sdks"

      - name: Build
        run: |
          make clean all
          make package \
            THEOS_PACKAGE_SCHEME=${{ matrix.scheme }} \
            FINALPACKAGE=1 \
            DEBUG=0 \
            ARCHS="arm64 arm64e"
          echo "--- built ---"
          ls -l packages/

      - name: Verify architecture
        run: |
          set -e
          DEB=$(ls packages/*.deb | head -1)
          echo "deb: $DEB"
          dpkg-deb -f "$DEB" Architecture Package Version
          TMP=$(mktemp -d)
          dpkg-deb -x "$DEB" "$TMP"
          DYLIB=$(find "$TMP" -name 'Auxo16Probe.dylib' | head -1)
          echo "dylib: $DYLIB"
          python3 tools/verify_arch.py "$DYLIB"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Auxo16Probe-${{ matrix.artifact }}
          path: packages/*.deb
          if-no-files-found: error
