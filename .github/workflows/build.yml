name: Build Auxo16 Probe

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          # rootless: Architecture iphoneos-arm64, installs to /var/jb
          - scheme: rootless
            deb_arch: iphoneos-arm64
            artifact: rootless
          # RootHide: Architecture iphoneos-arm64e, installs to /
          - scheme: roothide
            deb_arch: iphoneos-arm64e
            artifact: roothide

    name: build (${{ matrix.scheme }})

    steps:
      - uses: actions/checkout@v4

      - name: Install theos
        run: |
          brew install ldid xz
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Install SDK
        run: |
          mkdir -p "$THEOS/sdks"
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/sdks
          cd /tmp/sdks
          git sparse-checkout set iPhoneOS16.5.sdk
          cp -R iPhoneOS16.5.sdk "$THEOS/sdks/"
          ls "$THEOS/sdks"

      - name: Set package architecture
        run: |
          sed -i '' 's/^Architecture:.*/Architecture: ${{ matrix.deb_arch }}/' layout/DEBIAN/control
          grep '^Architecture' layout/DEBIAN/control

      - name: Build
        run: |
          make clean all
          make package \
            THEOS_PACKAGE_SCHEME=${{ matrix.scheme }} \
            FINALPACKAGE=1 \
            DEBUG=0 \
            ARCHS="arm64 arm64e"
          echo "--- built ---"
          ls -l packages/

      - name: Verify architecture
        run: |
          DEB=$(ls packages/*.deb | head -1)
          echo "deb: $DEB"
          dpkg-deb -f "$DEB" Architecture Package Version
          TMP=$(mktemp -d)
          dpkg-deb -x "$DEB" "$TMP"
          DYLIB=$(find "$TMP" -name 'Auxo16Probe.dylib' | head -1)
          echo "dylib: $DYLIB"
          python3 tools/verify_arch.py "$DYLIB"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Auxo16Probe-${{ matrix.artifact }}
          path: packages/*.deb
          if-no-files-found: error
